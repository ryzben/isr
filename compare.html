<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compare schools — Islamic School Review</title>
  <meta name="description" content="Compare available details for Islamic schools side by side." />
  <link rel="canonical" href="https://www.islamicschoolreview.com/compare" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="theme-color" content="#0F5132" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css?v=20261002" />
  <style>
    .compare-hero { padding: 48px 0 32px; background: var(--surface-alt, #f7f8f6); }
    .compare-section { padding: 32px 0 72px; }
    .compare-table-wrap { overflow-x: auto; }
    .compare-table { min-width: 720px; }
    .compare-header, .compare-row {
      display: grid;
      grid-template-columns: minmax(150px, .8fr) repeat(var(--school-count), minmax(190px, 1fr));
    }
    .compare-header { align-items: stretch; gap: 12px; margin-bottom: 16px; }
    .compare-header__card { display: flex; flex-direction: column; gap: 10px; padding: 18px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface, #fff); }
    .compare-photo { position: relative; display: grid; place-items: center; height: 128px; overflow: hidden; border-radius: var(--r-sm); color: #fff; background: linear-gradient(135deg, var(--primary), #1d7a4e); font: 600 1.8rem var(--font-serif); }
    .compare-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .compare-row { border-bottom: 1px solid var(--line); }
    .compare-cell { padding: 14px 12px; overflow-wrap: anywhere; }
    .compare-cell--label { font-weight: 600; color: var(--ink-soft); }
    .compare-empty { max-width: 640px; padding: 44px 24px; margin: 0 auto; text-align: center; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface, #fff); }
    .compare-actions { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px; margin-bottom: 20px; }
    .compare-add-school, .compare-print { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .compare-add-school label { font-weight: 600; }
    .compare-add-school select { min-width: 220px; }
    .compare-print { justify-content: flex-end; }
    .compare-print-hint { width: 100%; margin: 0; text-align: right; }
    .compare-remove { align-self: flex-start; }
    @media print {
      .site-header, .site-footer, #site-footer, .compare-hero .breadcrumbs, .compare-actions, .compare-remove { display: none !important; }
      .compare-hero { padding: 0 0 16px; background: none; }
      .compare-section { padding: 0; }
      .compare-section .container { width: 100%; max-width: none; padding: 0; }
      .compare-table-wrap { overflow: visible; }
      .compare-table { min-width: 0; width: 100%; }
      .compare-header, .compare-row {
        grid-template-columns: minmax(90px, .65fr) repeat(var(--school-count), minmax(0, 1fr));
        gap: 0;
        break-inside: avoid;
      }
      .compare-cell { padding: 8px 6px; }
      .compare-header__card { box-shadow: none; }
    }
    @media (max-width: 640px) {
      .compare-hero { padding: 32px 0 24px; }
      .compare-section { padding: 24px 0 48px; }
    }
  </style>
</head>
<body>

<script src="assets/site-chrome.js?v=20261002"></script>

<main id="main">
  <section class="compare-hero">
    <div class="container">
      <div class="breadcrumbs"><a href="index">Home</a> · <a href="directory">Directory</a> · <span>Compare schools</span></div>
      <h1>Compare schools</h1>
      <p class="lede">Compare available listing details side by side. Missing information is shown as a dash.</p>
    </div>
  </section>
  <section class="compare-section">
    <div class="container" id="compareContent" aria-live="polite">
      <p class="muted">Loading comparison…</p>
    </div>
  </section>
</main>

<div id="site-footer"></div>
<script src="assets/main.js?v=20261002"></script>
<script type="module">
  import { getSchools, schoolInitials, schoolPagePath, schoolStatus } from './assets/schools-data.js?v=20261002';

  const content = document.getElementById('compareContent');
  const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  })[character]);
  let selectedIds = [...new Set((new URLSearchParams(location.search).get('ids') || '')
    .split(',').map((id) => id.trim()).filter(Boolean))].slice(0, 3);
  let allSchools = [];
  let selectedSchools = [];

  function showEmptyState(message) {
    content.innerHTML = `<div class="compare-empty">
      <h2>${escapeHtml(message)}</h2>
      <p>Choose schools from the directory to compare the information available in their listings.</p>
      <a href="directory" class="btn btn--primary">Browse schools</a>
    </div>`;
  }

  function renderComparison(schools) {
    const columnCount = Math.max(schools.length, 1);
    const availableSchools = allSchools.filter((school) => !schools.some((selected) => selected.id === school.id));
    const schoolOptions = availableSchools.map((school) => {
      const location = [school.city, school.state].filter(Boolean).join(', ');
      return `<option value="${escapeHtml(school.id)}">${escapeHtml(`${school.name}${location ? ` — ${location}` : ''}`)}</option>`;
    }).join('');
    const headers = schools.map((school) => `
      <div class="compare-header__card">
        <div class="compare-photo" data-school-id="${escapeHtml(school.id)}">${escapeHtml(schoolInitials(school.name))}</div>
        <strong>${escapeHtml(school.name)}</strong>
        <span class="muted small">${escapeHtml([school.city, school.state].filter(Boolean).join(', ') || 'Location unavailable')}</span>
        <span class="badge">${escapeHtml(schoolStatus(school))}</span>
        <a href="${schoolPagePath(school.id)}" class="btn btn--ghost btn--sm">View profile</a>
        <button type="button" class="btn btn--ghost btn--sm compare-remove" data-remove-school="${escapeHtml(school.id)}" aria-label="Remove ${escapeHtml(school.name)} from comparison">Remove</button>
      </div>`).join('');

    function row(label, values) {
      return `<div class="compare-row">
        <div class="compare-cell compare-cell--label">${escapeHtml(label)}</div>
        ${values.map((value) => `<div class="compare-cell">${value ? escapeHtml(value) : '<span class="muted">—</span>'}</div>`).join('')}
      </div>`;
    }

    const rows = [
      ['Grades', schools.map((school) => school.grades)],
      ['Tuition', schools.map((school) => school.tuition_range)],
      ['Location', schools.map((school) => [school.city, school.state].filter(Boolean).join(', '))],
      ['Address', schools.map((school) => school.address)],
      ['Phone', schools.map((school) => school.phone)],
      ['Website', schools.map((school) => school.website)],
      ['Accreditation', schools.map((school) => school.accreditation)],
      ['Enrollment', schools.map((school) => school.enrollment)],
    ].map(([label, values]) => row(label, values)).join('');

    content.innerHTML = `<div class="compare-actions">
        <div class="compare-add-school">
          <label for="compareAddSchool">Add a school</label>
          <select class="select" id="compareAddSchool" aria-label="Add a school to this comparison" ${schools.length >= 3 || !availableSchools.length ? 'disabled' : ''}>
            <option value="">Choose a school</option>${schoolOptions}
          </select>
          <button type="button" class="btn btn--ghost" data-add-school ${schools.length >= 3 || !availableSchools.length ? 'disabled' : ''}>Add</button>
        </div>
        <div class="compare-print">
          <button type="button" class="btn btn--ghost" data-print-comparison ${schools.length < 2 ? 'disabled' : ''}>Print comparison</button>
          ${schools.length < 2 ? '<p class="compare-print-hint muted">Select at least 2 schools to print.</p>' : ''}
        </div>
      </div>
      <h2>Compare ${schools.length} school${schools.length === 1 ? '' : 's'}</h2>
      <p class="muted">Information shown is based on the available school listings.</p>
      <div class="compare-table-wrap">
        <div class="compare-table" style="--school-count:${columnCount}">
          <div class="compare-header">
            <div></div>${headers}
          </div>${rows}
        </div>
      </div>`;

    content.querySelectorAll('.compare-photo[data-school-id]').forEach((photo) => {
      const school = schools.find((item) => item.id === photo.dataset.schoolId);
      if (!school || !/^https?:\/\//i.test(school.photo_url || '')) return;
      const image = document.createElement('img');
      image.src = school.photo_url;
      image.alt = '';
      image.loading = 'lazy';
      image.addEventListener('error', () => image.remove(), { once: true });
      photo.append(image);
    });
  }

  content.addEventListener('click', (event) => {
    const removeButton = event.target.closest('[data-remove-school]');
    if (removeButton) {
      selectedSchools = selectedSchools.filter((school) => school.id !== removeButton.dataset.removeSchool);
      updateComparison();
      return;
    }

    const addButton = event.target.closest('[data-add-school]');
    if (addButton && !addButton.disabled) {
      const select = content.querySelector('#compareAddSchool');
      const school = allSchools.find((item) => item.id === select.value);
      if (school && selectedSchools.length < 3) {
        selectedSchools = [...selectedSchools, school];
        updateComparison();
      }
      return;
    }

    const printButton = event.target.closest('[data-print-comparison]');
    if (printButton && !printButton.disabled) window.print();
  });

  content.addEventListener('change', (event) => {
    if (event.target.matches('#compareAddSchool')) {
      const addButton = content.querySelector('[data-add-school]');
      if (addButton) addButton.disabled = !event.target.value || selectedSchools.length >= 3;
    }
  });

  function updateComparison() {
    const url = new URL(window.location.href);
    if (selectedSchools.length) url.searchParams.set('ids', selectedSchools.map((school) => school.id).join(','));
    else url.searchParams.delete('ids');
    history.replaceState(null, '', `${url.pathname}${url.search}${url.hash}`);
    selectedIds = selectedSchools.map((school) => school.id);

    if (!selectedSchools.length) {
      showEmptyState('No schools selected');
      return;
    }
    renderComparison(selectedSchools);
    document.title = `Compare: ${selectedSchools.map((school) => school.name).join(' vs ')} — Islamic School Review`;
  }

  try {
    allSchools = await getSchools();
    selectedSchools = selectedIds
      .map((id) => allSchools.find((school) => school.id === id))
      .filter(Boolean);
    if (!selectedSchools.length) {
      showEmptyState(selectedIds.length ? 'No matching school listings found' : 'No schools selected');
    } else {
      updateComparison();
    }
  } catch (error) {
    console.error('Could not load school comparison:', error);
    showEmptyState('Could not load the comparison');
  }
</script>
</body>
</html>
