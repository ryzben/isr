<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Islamic-school jobs — coming soon | Islamic School Review</title>
  <meta name="description" content="The Islamic School Review jobs board is coming soon. Register your interest while we prepare the service." />
  <link rel="canonical" href="https://www.islamicschoolreview.com/jobs" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="theme-color" content="#0F5132" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css?v=20261002" />
  <style>
    .jobs-coming-soon { max-width: 720px; margin: 0 auto; text-align: center; }
    .jobs-interest-form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; margin: 28px auto 0; max-width: 680px; }
    .jobs-interest-form .input, .jobs-interest-form .select { min-width: 0; }
    .jobs-interest-status { min-height: 1.5em; margin-top: 16px; }
    @media (max-width: 650px) { .jobs-interest-form { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<script src="assets/site-chrome.js?v=20261002"></script>

<main id="main">
  <section class="section section--alt">
    <div class="container jobs-coming-soon">
      <span class="eyebrow">Coming soon</span>
      <h1>Islamic-school jobs board</h1>
      <p class="lede">Job listings, job posting, applications, and educator profiles are not available yet. Register your interest while we prepare the service; submitting this form does not guarantee a launch date or follow-up email.</p>

      <form class="jobs-interest-form" id="jobsInterestForm" action="https://formspree.io/f/mjglvggk" method="POST">
        <input type="hidden" name="_subject" value="Jobs board interest — IslamicSchoolReview.com" />
        <input type="hidden" name="form_type" value="jobs_waitlist" />
        <label class="sr-only" for="jobsInterestEmail">Email address</label>
        <input class="input" type="email" id="jobsInterestEmail" name="email" placeholder="you@example.com" required autocomplete="email" />
        <label class="sr-only" for="jobsInterestType">I am interested as</label>
        <select class="select" id="jobsInterestType" name="interest_type" required>
          <option value="">I am interested as…</option>
          <option value="educator">An educator</option>
          <option value="school">A school representative</option>
        </select>
        <button class="btn btn--primary" type="submit">Register interest</button>
      </form>
      <p class="jobs-interest-status" id="jobsInterestStatus" role="status" aria-live="polite"></p>
      <p><a href="claim">For school listing claims</a> · <a href="directory">Browse schools</a></p>
    </div>
  </section>
</main>

<div id="site-footer"></div>
<script src="assets/main.js?v=20261002"></script>
<script>
  const jobsInterestForm = document.getElementById("jobsInterestForm");
  jobsInterestForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    const button = jobsInterestForm.querySelector('button[type="submit"]');
    const status = document.getElementById("jobsInterestStatus");
    button.disabled = true;
    status.textContent = "Submitting…";
    try {
      const response = await fetch(jobsInterestForm.action, {
        method: "POST",
        body: new FormData(jobsInterestForm),
        headers: { Accept: "application/json" },
      });
      if (!response.ok) throw new Error(`Form submission failed (${response.status}).`);
      jobsInterestForm.reset();
      status.textContent = "Your interest was submitted. There is no launch date yet.";
    } catch (error) {
      console.error("Could not submit jobs-board interest:", error);
      status.textContent = "We could not submit your interest. Please try again later.";
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
